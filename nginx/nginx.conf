events { worker_connections 1024; }

http {
    upstream flask_apps {
        server app-01:5000;
        server app-02:5000;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://flask_apps;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
